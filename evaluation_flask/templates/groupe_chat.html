<h2>Chat du groupe</h2>

<div id="chat-messages" style="max-height:500px;overflow-y:auto;">
    {% for msg in messages %}
        <p>
            <img src="{{ url_for('static', filename='avatars/' + (msg['sender_avatar'] or 'default.png')) }}" 
                 alt="avatar" style="width:30px;height:30px;border-radius:50%;vertical-align:middle;">
            <b>{{ msg['sender_name'] }}</b> :
            {% if msg['content'] %}
                {{ msg['content'] }}
            {% endif %}
            {% if msg['audio_url'] %}
                <audio controls>
                    <source src="{{ url_for('serve_audio', filename=msg['audio_url']) }}" type="{{ msg['audio_mime'] }}">
                    Votre navigateur ne supporte pas l'audio.
                </audio>
            {% endif %}
            {% if msg['image_url'] %}
                <br>
                <img src="{{ url_for('static', filename='images/' + msg['image_url']) }}" 
                     alt="image envoyée" style="max-width:200px;display:block;margin-top:5px;">
            {% endif %}
        </p>
    {% endfor %}
</div>

<form method="POST" enctype="multipart/form-data">
    <input type="text" name="content" placeholder="Message">
    <input type="file" name="audio" accept="audio/*">
    <input type="file" name="image" accept="image/*">
    <button type="submit">Envoyer</button>
</form>

<script>
let lastMessageId = {{ messages[-1]['id'] if messages else 0 }};
const groupId = {{ groupe['id'] }};
const chatDiv = document.getElementById('chat-messages');

function scrollToBottom(){
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

scrollToBottom();

async function fetchNewMessages() {
    try {
        const response = await fetch(`/groupe/${groupId}/new/${lastMessageId}`);
        const newMessages = await response.json();
        newMessages.forEach(msg => {
            const p = document.createElement('p');

            let contentHtml = `<img src="/static/avatars/${msg.sender_avatar || 'default.png'}" 
                                alt="avatar" style="width:30px;height:30px;border-radius:50%;vertical-align:middle;"> 
                                <b>${msg.sender_name}</b> : `;

            contentHtml += msg.content || '';

            if(msg.audio_url){
                contentHtml += `<audio controls>
                                    <source src="/serve_audio/${msg.audio_url}" type="${msg.audio_mime}">
                                    Votre navigateur ne supporte pas l'audio.
                                </audio>`;
            }

            if(msg.image_url){
                contentHtml += `<br><img src="/static/images/${msg.image_url}" 
                                 alt="image envoyée" style="max-width:200px;display:block;margin-top:5px;">`;
            }

            p.innerHTML = contentHtml;
            chatDiv.appendChild(p);

            lastMessageId = msg.id;
        });

        if(newMessages.length > 0) scrollToBottom();
    } catch (err) {
        console.error(err);
    }
}

setInterval(fetchNewMessages, 3000);
</script>
